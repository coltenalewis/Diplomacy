<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Command</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%2302070b%22/%3E%3Cpath d=%22M8 1L15 8L8 15L1 8Z%22 fill=%22none%22 stroke=%22%2339d5ff%22 stroke-width=%221.5%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222%22 fill=%22%2339d5ff%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-mark">&#9672;</span> GLOBAL COMMAND <span class="brand-sub">STRATEGIC OPERATIONS CENTER</span></div>
    <div class="tb-phase"><span id="tb-date">--</span><span id="tb-phase" class="tag">--</span></div>
    <div class="tb-defcon" title="Global threat level, driven by active wars and betrayals">
      <span class="lbl">DEFCON</span><div id="defcon" class="defcon"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="tb-power" id="tb-power"></div>
    <div class="tb-clock" id="tb-clock">--:--:-- Z</div>
    <div class="tb-actions">
      <button id="btn-save" class="btn ghost" title="Save game">SAVE</button>
      <button id="btn-load" class="btn ghost" title="Load saved game">LOAD</button>
      <button id="btn-new" class="btn ghost" title="New operation">NEW OP</button>
      <button id="btn-help" class="btn ghost" title="Field manual">MANUAL</button>
    </div>
  </header>

  <main id="stage">
    <svg id="map" class="z-low" aria-label="World map"></svg>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="frame-corners"><i></i><i></i><i></i><i></i></div>

    <section id="theater" class="hud">
      <div class="hud-title">THEATER STATUS <span id="theater-target"></span></div>
      <div id="theater-list"></div>
    </section>

    <div id="readout" class="hud readout">
      <div id="ro-region">--</div>
      <div id="ro-coords">--</div>
    </div>

    <div id="zoombar" class="hud zoombar">
      <button data-z="in" title="Zoom in">+</button>
      <button data-z="out" title="Zoom out">&minus;</button>
      <button data-z="home" title="Center on capital">&#8962;</button>
    </div>

    <div id="tooltip" class="tooltip hidden"></div>
    <div id="order-pop" class="order-pop hidden"></div>
    <div id="banner" class="banner hidden"></div>
    <div id="toasts"></div>
  </main>

  <aside id="panel">
    <nav class="tabs">
      <button data-tab="orders" class="active">ORDERS</button>
      <button data-tab="diplomacy">DIPLOMACY <b id="unread" class="badge hidden">0</b></button>
      <button data-tab="intel">INTEL</button>
    </nav>
    <div class="tab-body" id="tab-orders"></div>
    <div class="tab-body hidden" id="tab-diplomacy"></div>
    <div class="tab-body hidden" id="tab-intel"></div>
  </aside>

  <footer id="ticker"><span class="tk-label">SIGINT FEED</span><div class="tk-track"><div id="tk-text"></div></div></footer>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
<div id="processing" class="processing hidden">
  <div class="proc-card">
    <div class="radar"><i></i></div>
    <div class="proc-title" id="proc-title">ADJUDICATING</div>
    <div class="proc-lines" id="proc-lines"></div>
    <div class="proc-bar"><i id="proc-bar"></i></div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
